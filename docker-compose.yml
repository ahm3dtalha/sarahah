services:
  localstack:
    container_name: localstack-main
    image: localstack/localstack
    ports:
      - "4566:4566"
    environment:
      - PERSISTENCE=1
      - LOCALSTACK_AUTH_TOKEN=ls-tArI8522-ROka-Lota-yIxA-6685Jozae76a
      - DEBUG=${DEBUG:-0}
      - LAMBDA_EXECUTOR=local
    volumes:
      - "./volume:/var/lib/localstack"
      - "/var/run/docker.sock:/var/run/docker.sock"
   

  app:
    build: ./application
    container_name: sarahah-app
    ports:
      - "8000:8000"
    environment:
      - AWS_ENDPOINT_URL=http://localstack:4566
      - JWT_SECRET=${JWT_SECRET:-dev-only-change-me}
    depends_on:
      - localstack
        