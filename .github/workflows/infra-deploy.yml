name: Deploy Infrastructure

# تحديد متى يعمل هذا الخط (Trigger)
on:
  push:
    branches:
      - main  # أو master (حسب اسم فرعك الأساسي)
    paths:
      - 'infra/**'  # لن يعمل إلا إذا حدث تغيير داخل مجلد infra فقط

jobs:
  terraform-deploy:
    runs-on: ubuntu-latest

    # جعل مسار التنفيذ الافتراضي هو مجلد الـ infra مباشرة
    defaults:
      run:
        working-directory: infra

    steps:
      # 1.سحب كود المشروع من جيثب
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 2. تثبيت أداة Terraform على سيرفر الجيثب الوهمي
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      # 3. إعداد بيانات الاتصال بسحابة AWS بأمان عبر الـ Secrets
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-southeast-2  # المنطقة التي نجحت معك

      # 4. تهيئة 
      - name: Terraform Init
        run: terraform init

      # 5. تطبيق التغييرات على AWS تلقائياً
      - name: Terraform apply
        run: terraform apply -auto-approve -var="use_localstack=false" -var="aws_region=ap-southeast-2"
