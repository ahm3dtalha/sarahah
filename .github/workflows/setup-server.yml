name: Deploy Setup To Server

on:
  workflow_dispatch:

  push:
    branches:
      - main
    paths:
      - 'scripts/**'
      - '.github/workflows/setup-server.yml'
    
  workflow_run:
    workflows: ["Deploy Infrastructure"]
    types:
      - completed

env:
  AWS_REGION: ap-southeast-2
  TF_WORKING_DIR: infra
  SETUP_SCRIPT: scripts/setup.sh   # تحقق من مسار الملف بعد إعادة الترتيب

jobs:
  configure-server:
    if: ${{ github.event_name == 'workflow_dispatch' || ( github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' ) ||  github.event_name == 'push'  }}
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      # wrapper=false حتى لا تتلوث مخرجات terraform output بنصوص إضافية
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false

      - name: Terraform init
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform init -input=false

      # جلب الـ outputs دون طباعة JWT_SECRET في السجل
      - name: Read Terraform outputs
        id: tf
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: |
          if ! terraform output -raw ec2_public_ip >/dev/null 2>&1; then
            echo "::error::لا توجد outputs في الـ state. تأكد من استخدام remote backend (مثل S3) وأن apply نُفِّذ عليه."
            exit 1
          fi
          JWT=$(terraform output -raw jwt_secret)
          echo "::add-mask::$JWT"
          {
            echo "ip=$(terraform output -raw ec2_public_ip)"
            echo "users_table=$(terraform output -raw users_table_name)"
            echo "messages_table=$(terraform output -raw messages_table_name)"
            echo "ecr_base=$(terraform output -raw ecr_base_url)"
            echo "jwt_secret=$JWT"
          } >> "$GITHUB_OUTPUT"
          echo "EC2 IP: $(terraform output -raw ec2_public_ip)"

      - name: Prepare SSH key
        env:
          SSH_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          EC2_IP: ${{ steps.tf.outputs.ip }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          # انتظر حتى يستجيب السيرفر على المنفذ 22 (حتى 5 دقائق)
          for i in $(seq 1 30); do
            KEYS=$(ssh-keyscan -T 5 -H "$EC2_IP" 2>/dev/null || true)
            if [ -n "$KEYS" ]; then
              echo "$KEYS" >> ~/.ssh/known_hosts
              break
            fi
            echo "SSH not ready yet ($i/30)..."
            sleep 10
          done
          if [ ! -s ~/.ssh/known_hosts ]; then
            echo "::error::تعذّر الوصول إلى السيرفر على المنفذ 22 (تحقق من الـ Security Group)"
            exit 1
          fi

      # نبني ملف env على الـ runner ثم ننسخه (لا يظهر في cmdline)
      - name: Build env file
        env:
          ECR_BASE: ${{ steps.tf.outputs.ecr_base }}
          USERS_TABLE: ${{ steps.tf.outputs.users_table }}
          MESSAGES_TABLE: ${{ steps.tf.outputs.messages_table }}
          JWT_SECRET: ${{ steps.tf.outputs.jwt_secret }}
        run: |
          umask 077
          cat > /tmp/sarahah.env <<EOF
          AWS_REGION=${AWS_REGION}
          ECR_BASE=${ECR_BASE}
          USERS_TABLE=${USERS_TABLE}
          MESSAGES_TABLE=${MESSAGES_TABLE}
          QUEUE_NAME=sarahah-messages
          JWT_SECRET=${JWT_SECRET}
          EOF

      - name: Copy setup.sh & env to server
        env:
          EC2_IP: ${{ steps.tf.outputs.ip }}
          SSH_USER: ${{ secrets.SSH_USER }}
        run: |
          scp -i ~/.ssh/deploy_key -o BatchMode=yes \
            "$SETUP_SCRIPT" /tmp/sarahah.env \
            "$SSH_USER@$EC2_IP:/tmp/"

      - name: Run setup.sh remotely
        env:
          EC2_IP: ${{ steps.tf.outputs.ip }}
          SSH_USER: ${{ secrets.SSH_USER }}
        run: |
          ssh -i ~/.ssh/deploy_key -o BatchMode=yes "$SSH_USER@$EC2_IP" \
            'chmod 600 /tmp/sarahah.env; set -a; . /tmp/sarahah.env; set +a; chmod +x /tmp/setup.sh; bash /tmp/setup.sh; rc=$?; shred -u /tmp/sarahah.env 2>/dev/null || rm -f /tmp/sarahah.env; exit $rc'

      - name: Cleanup local env
        if: always()
        run: rm -f /tmp/sarahah.env ~/.ssh/deploy_key
