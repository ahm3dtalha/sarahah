name: Deploy FastAPI App to ECR

on:
  push:
    branches:
      - main
    paths:
      - 'application/**'
      - '.github/workflows/app-deploy.yml'

jobs:
  build-and-push-app:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-southeast-2

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build, tag, and push FastAPI image to ECR
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: fastapi-app
          ECR_NGINX_REPOSITORY: nginx
          IMAGE_TAG: latest
        run: |
          # بناء الصورة بناءً على سياق مجلد التطبيق وملف الـ Dockerfile الموجود هناك
          docker build -f ./application/Dockerfile -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG ./application
          
          # دفع الصورة إلى مستودع ECR على AWS
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
          
          # بناء صورة Nginx ودفعها إلى مستودع ECR
          docker build -f ./nginx/Dockerfile -t $ECR_REGISTRY/$ECR_NGINX_REPOSITORY:$IMAGE_TAG ./nginx
          docker push $ECR_REGISTRY/$ECR_NGINX_REPOSITORY:$IMAGE_TAG
          
