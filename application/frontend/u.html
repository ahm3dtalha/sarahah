<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>صراحة | Sarahah</title>
<link rel="icon" href="logo.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Readex+Pro:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css?v=5">
</head>
<body>

<header id="site-header"></header>

<main class="center" style="min-height:80vh">
  <div class="panel">

    <div class="who-box" id="intro">
      <div class="av big" id="bigav">?</div>
      <p class="tagline"><span data-i18n="u_to"></span> <b id="to"></b></p>
    </div>

    <div class="card">
      <form id="form" class="hidden">
        <label for="text" data-i18n="u_text"></label>
        <textarea id="text" maxlength="500" required></textarea>
        <p class="counter"><span id="n">0</span> / 500</p>
        <label for="sender" data-i18n="u_sender"></label>
        <input id="sender" maxlength="30">
        <p class="err" id="err" role="alert"></p>
        <button class="btn wide" id="send" data-i18n="u_send"></button>
        <p class="note" data-i18n="u_note"></p>
      </form>

      <div id="done" class="done hidden">
        <h2 data-i18n="u_done"></h2>
        <p class="hint" data-i18n="u_done_s"></p>
        <button class="btn ghost" id="again" type="button" data-i18n="u_again"></button>
        <br>
        <a class="btn" href="login.html?m=register" data-i18n="u_get"></a>
      </div>

      <p id="bad" class="empty hidden" data-i18n="u_bad"></p>
    </div>

  </div>
</main>

<script src="app.js"></script>
<script src="i18n.js"></script>
<script src="header.js"></script>
<script>
const $ = id => document.getElementById(id);
const u = new URLSearchParams(location.search).get("u") || "";
const base = "/public/" + encodeURIComponent(u);
let state = "loading";   // loading | ok | bad

function paint() {
  $("form").classList.toggle("hidden", state !== "ok");
  $("bad").classList.toggle("hidden", state !== "bad");
  $("intro").classList.toggle("hidden", state === "bad");
  $("sender").placeholder = t("u_ph");
}
window.onLang = paint;

(async () => {
  try {
    const p = await api(base);
    $("to").textContent = "@" + p.username;
    $("bigav").textContent = p.username[0].toUpperCase();
    state = "ok";
  } catch {
    state = "bad";
  }
  paint();
})();

$("text").oninput = () => $("n").textContent = $("text").value.length;

$("form").addEventListener("submit", async e => {
  e.preventDefault();
  $("err").textContent = "";
  $("send").disabled = true;
  try {
    await api(base + "/messages", { method: "POST",
      body: JSON.stringify({ text: $("text").value, sender_name: $("sender").value }) });
    $("form").classList.add("hidden");
    $("done").classList.remove("hidden");
  } catch (x) {
    $("err").textContent = x.message;
  }
  $("send").disabled = false;
});

$("again").onclick = () => {
  $("text").value = "";
  $("n").textContent = "0";
  $("done").classList.add("hidden");
  $("form").classList.remove("hidden");
};

setLang(LANG);
</script>
</body>
</html>
