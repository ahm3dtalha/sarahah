name: sarahah

services:
  # ---------- التطبيق ----------
  fastapi-app:
    image: ${ECR_BASE}/fastapi-app:latest
    restart: unless-stopped
    environment:
      AWS_REGION: ${AWS_REGION}
      USERS_TABLE: ${USERS_TABLE}
      MESSAGES_TABLE: ${MESSAGES_TABLE}
      QUEUE_NAME: ${QUEUE_NAME}
      JWT_SECRET: ${JWT_SECRET}

  nginx:
    image: ${ECR_BASE}/nginx-app:latest
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - fastapi-app

  # ---------- المراقبة (تعمل فقط مع --profile monitoring) ----------
  node-exporter:
    profiles: ["monitoring"]
    image: prom/node-exporter:latest
    restart: unless-stopped
    pid: host
    command: ["--path.rootfs=/host"]
    volumes:
      - /:/host:ro,rslave

  cadvisor:
    profiles: ["monitoring"]
    image: gcr.io/cadvisor/cadvisor:latest
    restart: unless-stopped
    privileged: true
    devices:
      - /dev/kmsg
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro

  prometheus:
    profiles: ["monitoring"]
    image: prom/prometheus:latest
    restart: unless-stopped
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus

  grafana:
    profiles: ["monitoring"]
    image: grafana/grafana:latest
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:3000"   # للدخول من جهازك: ssh -L 3000:localhost:3000 ubuntu@IP
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - grafana-data:/var/lib/grafana
    depends_on:
      - prometheus

volumes:
  prometheus-data:
  grafana-data:
